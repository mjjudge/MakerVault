# MakerVault — Nginx reverse proxy configuration
#
# Routes:
#   /api/*  → api service (FastAPI) on port 8000
#   /       → web service (React SPA) on port 80
#
# This file is mounted read-only into the nginx container at:
#   /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # API — proxy to FastAPI backend
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts suitable for slow AI enrichment requests
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;

        # Needed for streaming responses (e.g. SSE, chunked AI output)
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Web — proxy to React frontend (Vite dev or built static assets)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass         http://web:80;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Vite HMR websocket support
        proxy_cache_bypass $http_upgrade;
    }
}
